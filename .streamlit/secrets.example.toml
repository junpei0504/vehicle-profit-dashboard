# このサンプルを secrets.toml にコピー、またはStreamlit CloudのSecretsへ入力します。
# 実際の secrets.toml はGitHubへコミットしないでください。

# 初期状態：各ブラウザーのセッションごとにExcelを読み込みます。
storage_mode = "session"

# 共有運用する場合：上の storage_mode を remote に変えて、以下を設定します。
# storage_mode = "remote"
# backend_url = "https://sako-vehicle-profit.shbata.chatgpt.site"
# backend_token = ""
# admin_password = ""
# viewer_password = ""
# パスワードはそれぞれ12文字以上で、別のものを指定してください。

# ローカルPC・永続ディスク付きサーバーでSQLiteを使う場合：
# storage_mode = "sqlite"
# sqlite_path = "private-data/fleet.db"
# admin_password = ""
# viewer_password = ""
